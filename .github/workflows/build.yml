name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Windows (MSI + MSIX) ─────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^1" --locked

      - name: Build Tauri app (Windows)
        run: cargo tauri build

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v5
        with:
          name: windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v5
        with:
          name: windows-exe
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

      - name: Create MSIX package
        shell: pwsh
        run: |
          # Read version from tauri.conf.json and make it 4-part
          $version3 = (Get-Content "src-tauri/tauri.conf.json" | ConvertFrom-Json).package.version
          $version4 = "$version3.0"
          $msixName = "EBCDIC.Viewer_${version3}_x64.msix"

          # Create MSIX layout
          New-Item -ItemType Directory -Force -Path "msix_layout/Assets" | Out-Null

          # Copy main executable and any DLLs
          Copy-Item "src-tauri/target/release/EBCDIC Viewer.exe" "msix_layout/EBCDIC Viewer.exe"
          Get-ChildItem "src-tauri/target/release/*.dll" -ErrorAction SilentlyContinue |
            Copy-Item -Destination "msix_layout/"

          # Copy icons (already correct sizes)
          Copy-Item "src-tauri/icons/Square44x44Logo.png"   "msix_layout/Assets/Square44x44Logo.png"
          Copy-Item "src-tauri/icons/Square150x150Logo.png" "msix_layout/Assets/Square150x150Logo.png"
          Copy-Item "src-tauri/icons/Square310x310Logo.png" "msix_layout/Assets/Square310x310Logo.png"
          Copy-Item "src-tauri/icons/StoreLogo.png"         "msix_layout/Assets/StoreLogo.png"

          # Generate Wide310x150Logo from Square310x310Logo using .NET
          Add-Type -AssemblyName System.Drawing
          $src  = [System.Drawing.Image]::FromFile((Resolve-Path "src-tauri/icons/Square310x310Logo.png"))
          $wide = New-Object System.Drawing.Bitmap(310, 150)
          $g    = [System.Drawing.Graphics]::FromImage($wide)
          $g.Clear([System.Drawing.Color]::Transparent)
          $g.DrawImage($src, 80, 0, 150, 150)
          $wide.Save((Join-Path (Resolve-Path "msix_layout/Assets") "Wide310x150Logo.png"),
                     [System.Drawing.Imaging.ImageFormat]::Png)
          $g.Dispose(); $src.Dispose(); $wide.Dispose()

          # Write AppxManifest.xml
          $manifest = @"
<?xml version="1.0" encoding="utf-8"?>
<Package xmlns="http://schemas.microsoft.com/appx/manifest/foundation/windows10"
         xmlns:uap="http://schemas.microsoft.com/appx/manifest/uap/windows10"
         xmlns:rescap="http://schemas.microsoft.com/appx/manifest/foundation/windows10/restrictedcapabilities">
  <Identity Name="PSRVentures.EBCDICViewer"
            Publisher="CN=E53C498B-BE26-4429-B6F3-E38F3830DC34"
            Version="$version4"
            ProcessorArchitecture="x64"/>
  <Properties>
    <DisplayName>EBCDIC Viewer</DisplayName>
    <PublisherDisplayName>PSRVentures</PublisherDisplayName>
    <Logo>Assets\StoreLogo.png</Logo>
  </Properties>
  <Dependencies>
    <TargetDeviceFamily Name="Windows.Desktop"
                        MinVersion="10.0.17763.0"
                        MaxVersionTested="10.0.22621.0"/>
  </Dependencies>
  <Resources>
    <Resource Language="en-us"/>
  </Resources>
  <Applications>
    <Application Id="EBCDICViewer"
                 Executable="EBCDIC Viewer.exe"
                 EntryPoint="Windows.FullTrustApplication">
      <uap:VisualElements DisplayName="EBCDIC Viewer"
                          Description="View and decode IBM mainframe EBCDIC files"
                          BackgroundColor="transparent"
                          Square150x150Logo="Assets\Square150x150Logo.png"
                          Square44x44Logo="Assets\Square44x44Logo.png">
        <uap:DefaultTile Wide310x150Logo="Assets\Wide310x150Logo.png"
                         Square310x310Logo="Assets\Square310x310Logo.png"/>
      </uap:VisualElements>
    </Application>
  </Applications>
  <Capabilities>
    <rescap:Capability Name="runFullTrust"/>
  </Capabilities>
</Package>
"@
          Set-Content "msix_layout/AppxManifest.xml" $manifest -Encoding UTF8

          # Find makeappx.exe from Windows SDK
          $makeappx = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" `
            -Recurse -Filter "makeappx.exe" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "x64" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1

          if (-not $makeappx) {
            Write-Error "makeappx.exe not found in Windows SDK"
            exit 1
          }

          Write-Host "Using: $($makeappx.FullName)"
          & $makeappx.FullName pack /d msix_layout /p $msixName /nv
          Write-Host "Created: $msixName"

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v5
        with:
          name: windows-msix
          path: "*.msix"
          if-no-files-found: warn

  # ── macOS Universal Binary ───────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust stable + both targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: macos-universal-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: macos-universal-cargo-

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^1" --locked

      - name: Build Universal Binary
        run: cargo tauri build --target universal-apple-darwin

      - name: Upload Universal DMG artifact
        uses: actions/upload-artifact@v5
        with:
          name: macos-universal-dmg
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: warn

  # ── Publish Release ──────────────────────────────────────────────────
  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read version from tauri.conf.json
        id: version
        run: |
          VERSION=$(jq -r '.package.version' src-tauri/tauri.conf.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Archive previous latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT=$(gh release list --repo ${{ github.repository }} --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || echo "")
          NEW_TAG="${{ steps.version.outputs.tag }}"
          if [ -n "$CURRENT" ] && [ "$CURRENT" != "$NEW_TAG" ]; then
            echo "Archiving previous release: $CURRENT"
            OLD_TITLE=$(gh release view "$CURRENT" --repo ${{ github.repository }} --json name --jq '.name' 2>/dev/null || echo "$CURRENT")
            gh release edit "$CURRENT" \
              --repo ${{ github.repository }} \
              --prerelease \
              --title "${OLD_TITLE} [Archived]" \
              || echo "Could not archive previous release"
          fi

      - name: Write release notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cat > release_notes.md << NOTES
          ## EBCDIC Viewer v${VERSION}

          ### Downloads
          | Platform | File |
          |----------|------|
          | Windows (Microsoft Store) | EBCDIC.Viewer_${VERSION}_x64.msix |
          | Windows (Direct MSI) | EBCDIC.Viewer_${VERSION}_x64_en-US.msi |
          | Windows (Direct EXE) | EBCDIC.Viewer_${VERSION}_x64-setup.exe |
          | macOS (Universal) | EBCDIC.Viewer_${VERSION}_universal.dmg |

          ### Windows Note
          For the best experience, install from the Microsoft Store (MSIX) — no security warnings.
          Direct MSI/EXE downloads may show a one-time SmartScreen warning — click More info then Run anyway.

          ### macOS Note
          After installing, run: xattr -cr "/Applications/EBCDIC Viewer.app"
          NOTES

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"

          gh release delete "$TAG" --repo ${{ github.repository }} --yes 2>/dev/null || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true

          mapfile -t FILES < <(find artifacts -type f)

          gh release create "$TAG" \
            --repo ${{ github.repository }} \
            --title "EBCDIC Viewer v${VERSION}" \
            --notes-file release_notes.md \
            --latest \
            "${FILES[@]}"
