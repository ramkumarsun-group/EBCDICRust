name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Windows ─────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^1" --locked

      - name: Build Tauri app (Windows)
        run: cargo tauri build

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v5
        with:
          name: windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v5
        with:
          name: windows-exe
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

  # ── macOS Universal Binary ───────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust stable + both targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: macos-universal-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: macos-universal-cargo-

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^1" --locked

      - name: Build Universal Binary
        run: cargo tauri build --target universal-apple-darwin

      - name: Upload Universal DMG artifact
        uses: actions/upload-artifact@v5
        with:
          name: macos-universal-dmg
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: warn

  # ── Publish Release ──────────────────────────────────────────────────
  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read version from tauri.conf.json
        id: version
        run: |
          VERSION=$(jq -r '.package.version' src-tauri/tauri.conf.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Archive previous latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT=$(gh release list --repo ${{ github.repository }} --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || echo "")
          NEW_TAG="${{ steps.version.outputs.tag }}"
          if [ -n "$CURRENT" ] && [ "$CURRENT" != "$NEW_TAG" ]; then
            echo "Archiving previous release: $CURRENT"
            OLD_TITLE=$(gh release view "$CURRENT" --repo ${{ github.repository }} --json name --jq '.name' 2>/dev/null || echo "$CURRENT")
            gh release edit "$CURRENT" \
              --repo ${{ github.repository }} \
              --prerelease \
              --title "${OLD_TITLE} [Archived]" \
              || echo "Could not archive previous release"
          fi

      - name: Write release notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cat > release_notes.md << NOTES
          ## EBCDIC Viewer v${VERSION}

          ### Downloads
          | Platform | File |
          |----------|------|
          | Windows (Installer) | EBCDIC.Viewer_${VERSION}_x64-setup.exe |
          | Windows (MSI) | EBCDIC.Viewer_${VERSION}_x64_en-US.msi |
          | macOS (Universal) | EBCDIC.Viewer_${VERSION}_universal.dmg |

          ### Windows Note
          If you see a SmartScreen warning, click **More info → Run anyway**.
          The app is not yet code-signed.

          ### macOS Note
          After installing, run: xattr -cr "/Applications/EBCDIC Viewer.app"
          NOTES

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"

          # Delete existing release with this tag if it exists
          gh release delete "$TAG" --repo ${{ github.repository }} --yes 2>/dev/null || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true

          # Gather all built files into an array
          mapfile -t FILES < <(find artifacts -type f)

          gh release create "$TAG" \
            --repo ${{ github.repository }} \
            --title "EBCDIC Viewer v${VERSION}" \
            --notes-file release_notes.md \
            --latest \
            "${FILES[@]}"
