name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:   # also triggerable manually from the Actions tab

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Rust stable ─────────────────────────────────────────────
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # Cache Cargo registry + build artefacts to speed up reruns
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: windows-cargo-

      # ── 3. Node.js (required by Tauri CLI build toolchain) ─────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ── 4. Build + upload with the official Tauri action ───────────
      # tauri-apps/tauri-action handles CLI install, build, and artefact
      # upload in one step. It also caches the Tauri CLI between runs.
      - name: Build and upload Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ''          # no release tag — just artefacts
          releaseName: ''
          releaseBody: ''
          releaseDraft: false
          prerelease: false
