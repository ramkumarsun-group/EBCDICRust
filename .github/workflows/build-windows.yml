name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:   # also triggerable manually from the Actions tab

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Rust stable ─────────────────────────────────────────────
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # Cache Cargo registry + build artefacts to speed up reruns
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: windows-cargo-

      # ── 3. Node.js (required by Tauri CLI build toolchain) ─────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ── 4. Tauri CLI ───────────────────────────────────────────────
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^1" --locked

      # ── 5. Build ───────────────────────────────────────────────────
      - name: Build Tauri app (Windows)
        run: cargo tauri build
        working-directory: .

      # ── 6. Upload installer artefacts ──────────────────────────────
      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: EBCDIC-Viewer-Windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

      - name: Upload NSIS installer (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: EBCDIC-Viewer-Windows-exe
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
